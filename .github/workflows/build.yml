name: SonarQube

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true

      - name: Install locked test environment
        run: uv sync --group test --python 3.11

      - name: Generate required coverage report
        run: uv run --python 3.11 pytest --cov=urbanpy --cov-report=xml

      - name: Scan and wait for the mandatory quality gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Report failed quality-gate conditions
        if: failure()
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            --get "$SONAR_HOST_URL/api/qualitygates/project_status" \
            --data-urlencode "projectKey=EL-BID_urbanpy" \
            | jq '{status: .projectStatus.status, conditions: [.projectStatus.conditions[] | {metricKey, status, actualValue, errorThreshold, comparator}]}'
