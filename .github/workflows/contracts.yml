name: External contracts

on:
  schedule:
    - cron: 17 4 * * 0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-contracts
  cancel-in-progress: false

env:
  UV_FROZEN: "true"

jobs:
  providers:
    name: Read-only provider contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true

      - name: Install locked test environment
        run: |
          uv python install 3.11
          uv sync --group test --python 3.11

      - name: Exercise provider contracts
        run: uv run --python 3.11 pytest -o addopts="" -m live tests/live_provider_test.py

  osrm:
    name: Small Linux OSRM integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true

      - name: Install locked test environment
        run: |
          uv python install 3.11
          uv sync --group test --python 3.11

      - name: Exercise the canonical Python OSRM lifecycle
        run: uv run --python 3.11 pytest -o addopts="" -m docker tests/osrm_docker_test.py

      - name: Preserve Docker diagnostics after failure
        if: failure()
        run: docker ps --all && docker images
