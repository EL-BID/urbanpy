name: CI

on:
  pull_request:
  push:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "true"

jobs:
  trunk:
    name: Trunk Code Quality
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Run locked repository linters
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
        with:
          check-mode: all

  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true

      - name: Install Python and locked development environment
        run: |
          uv python install 3.11
          uv sync --group test --group lint --python 3.11

      - name: Check source
        run: uv run --python 3.11 ruff check urbanpy tests

      - name: Type-check strict boundary modules
        run: uv run --python 3.11 mypy urbanpy/_clients urbanpy/errors.py urbanpy/geofabrik.py urbanpy/models

      - name: Run hermetic tests with coverage
        run: uv run --python 3.11 pytest --cov=urbanpy --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true

      - name: Install Python and locked test environment
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv python install "$PYTHON_VERSION"
          uv sync --group test --python "$PYTHON_VERSION"

      - name: Run hermetic tests
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv run --python "$PYTHON_VERSION" pytest

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Validate distributions
        run: |
          uvx --from twine==7.0.0 twine check dist/*
          uvx --from check-wheel-contents==0.6.3 check-wheel-contents dist/*.whl

  security:
    name: Dependency and license audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true

      - name: Install locked runtime and security environment
        run: |
          uv python install 3.11
          uv sync --group security --python 3.11

      - name: Export locked runtime dependencies
        run: uv export --no-dev --no-hashes --no-emit-project --output-file requirements-audit.txt

      - name: Audit known vulnerabilities
        run: uvx --from pip-audit==2.10.1 pip-audit --requirement requirements-audit.txt

      - name: Enforce reviewed runtime license policy
        run: uv run --python 3.11 python scripts/check_licenses.py --output dependency-licenses.json

      - name: Upload dependency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-evidence
          path: |
            dependency-licenses.json
            requirements-audit.txt
          if-no-files-found: error

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true

      - name: Install locked documentation environment
        run: uv sync --group docs --python 3.11

      - name: Build documentation
        run: uv run --python 3.11 sphinx-build --fail-on-warning --keep-going -b html docs/source docs/_build/html
